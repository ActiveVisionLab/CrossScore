name: CrossScore
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10.8
  # PyTorch CPU-only
  - pytorch=2.1.2
  - torchvision=0.16.2
  - cpuonly
  # CrossScore dependencies
  - transformers=4.33.3
  - omegaconf=2.3.0
  - pillow=10.0.1
  - imageio=2.31.4
  - numpy=1.26.2
  - matplotlib=3.8.0
  - tqdm=4.65.0
  - huggingface_hub=0.19.4
